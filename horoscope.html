<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🔮 เช็กดวงรายวัน - StyleMusicPro</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ... (สไตล์เดิมของคุณให้คงไว้เหมือนเดิม) ... */
.menu-toggle{ display:none; position:fixed; top:15px; left:15px; z-index:9999; width:42px; height:42px; border:none; border-radius:12px; background:#9b5cff; color:white; font-size:28px; cursor:pointer; }
*{ margin:0; padding:0; box-sizing:border-box; }
body{ font-family:'Poppins',sans-serif; background:#050816; color:white; overflow-x:hidden; width: 100vw; }
.container{ display:flex; height:100vh; max-width: 100%; }
.sidebar{ width:240px; background:rgba(7,11,24,.88); backdrop-filter:blur(12px); padding:25px; display:flex; flex-direction:column; gap:18px; border-right:1px solid rgba(255,255,255,.05); }
.logo{ font-size:30px; font-weight:700; color:#9b5cff; margin-bottom:20px; }
.menu{ padding:14px; border-radius:14px; cursor:pointer; background:rgba(255,255,255,.03); display: block; text-decoration: none; color: white; }
.menu.active { background:#9b5cff; }
.main{ flex:1; overflow-y:auto; padding:30px; }

.horo-wrapper { max-width: 600px; margin: 0 auto; text-align: center; }
.random-btn { padding: 15px 40px; font-size: 18px; border-radius: 30px; background: #9b5cff; color: white; border: none; cursor: pointer; margin-bottom: 30px; transition: 0.3s; }
.random-btn:hover { background: #7c4dff; transform: scale(1.05); }
.sanook-card { background: #0a0d1d; border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 30px; text-align: left; }
.horo-header { font-size: 22px; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }

@media(max-width:768px){ .menu-toggle{ display:block; } .sidebar{ position:fixed; left:-280px; top:0; width:260px; height:100%; z-index:1000; } .sidebar.active{ left:0; } .container{ flex-direction:column; } .main{ padding-top: 70px; } }
</style>
</head>
<body>

<button class="menu-toggle" onclick="toggleMenu()">☰</button>

<div class="container">
    <div class="sidebar" id="sidebar">
        <div class="logo">🎵 StyleMusicPro</div>
        <a href="index.html" class="menu">🏠 หน้าแรก / ฟังเพลง</a>
        <a href="horoscope.html" class="menu active">🔮 เช็กดวงรายวัน</a>
        <a href="lyrics.html" target="_blank" class="menu">📖 สรุปความหมายเพลง</a>
    </div>

    <div class="main">
        <div class="horo-wrapper">
            <h1 style="margin-bottom:20px;">🔮 ดวงคนเหงาประจำวัน</h1>
            <button class="random-btn" onclick="generateRandomHoro()">🎲 สุ่มคำทำนายดวงชะตา</button>
            <div id="horo-display"></div>
        </div>
    </div>
</div>

<script>
function toggleMenu() { document.getElementById('sidebar').classList.toggle('active'); }

// 1. เก็บคำทำนายทั้ง 7 วันไว้ในที่เดียว
const horoData = [
    { title: "วันอาทิตย์", color: "#ff4d4d", work: "งานหนักจนแทบไม่มีเวลาเศร้า โฟกัสกับงานให้เต็มที่นะ", money: "เปย์ตัวเองไปเยอะ ระวังเงินเก็บร่อยหรอ", love: "เปิด Playlist เพลงอกหักวนไป ร้องไห้ให้พอแล้วเริ่มใหม่" },
    { title: "วันจันทร์", color: "#ffcc00", work: "เริ่มต้นสัปดาห์ด้วยความรู้สึกหน่วงๆ เปิดเพลง Lo-fi ช่วยได้", money: "มีเกณฑ์เสียเงินกับของจุกจิกเพื่อความสุขเล็กๆ", love: "คนเก่ายังแวะมาในความคิด แต่อย่าเพิ่งรีบดึงใครเข้ามาแทนที่" },
    { title: "วันอังคาร", color: "#ff66b2", work: "เพื่อนร่วมงานจะเป็นที่ปรึกษาที่ดีในวันที่ใจเราอ่อนแอ", money: "การเงินนิ่งๆ ไม่หวือหวา เหมาะแก่การเก็บออม", love: "ความรักแบบเพื่อนอาจจะพัฒนา แต่ใจเย็นๆ ไว้ก่อน" },
    { title: "วันพุธ", color: "#00e676", work: "ไอเดียใหม่ๆ จะเกิดขึ้นถ้าลองเปลี่ยนบรรยากาศที่นั่งทำงาน", money: "มีโชคลาภเล็กๆ น้อยๆ จากสิ่งที่ไม่ได้ตั้งใจ", love: "คนที่ใช่จะเข้ามาในจังหวะที่คุณเริ่มรักตัวเอง" },
    { title: "วันพฤหัสฯ", color: "#ff9900", work: "งานราบรื่นดี แต่ระวังการสื่อสารที่อาจเข้าใจผิด", money: "ระวังรายจ่ายที่เกิดจากการตัดสินใจวู่วาม", love: "คนโสดมีเกณฑ์ได้คุยกับคนใหม่ที่คุยสนุกจนลืมเรื่องเศร้า" },
    { title: "วันศุกร์", color: "#3399ff", work: "งานมีความท้าทายสูง แต่อย่าแบกไว้คนเดียว", money: "มีเงินก้อนผ่านมือมาให้ชื่นใจ แต่ก็มีรายจ่ายรออยู่", love: "ใครที่เคยทำให้เสียใจ วันนี้เขาอาจจะไม่ได้อยู่ในใจคุณอีกต่อไป" },
    { title: "วันเสาร์", color: "#b366ff", work: "วันพักผ่อนที่ควรชาร์จแบตให้ตัวเองเต็มที่ที่สุด", money: "งดลงทุนใหญ่ๆ ในช่วงนี้ รักษาเงินไว้กับตัวดีที่สุด", love: "การอยู่คนเดียวในวันนี้ อาจทำให้คุณมองเห็นความรักชัดขึ้น" }
];

// 2. ฟังก์ชันสุ่มดวง
function generateRandomHoro() {
    const random = horoData[Math.floor(Math.random() * horoData.length)];
    document.getElementById("horo-display").innerHTML = `
        <div class="sanook-card" style="border-left: 6px solid ${random.color}">
            <div class="horo-header" style="color:${random.color}">ดวงประจำ${random.title}</div>
            <p style="margin-bottom:15px;"><strong>💼 การงาน:</strong> ${random.work}</p>
            <p style="margin-bottom:15px;"><strong>💰 การเงิน:</strong> ${random.money}</p>
            <p><strong>💖 ความรัก:</strong> ${random.love}</p>
        </div>
    `;
}

// 3. สุ่มให้ทันทีที่เข้าหน้าเว็บ
window.onload = generateRandomHoro;
</script>
</body>
</html>
