<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔮 เช็กดวงรายวัน ฉบับคนเหงา - StyleMusicPro</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<!-- ใส่ style.css หรือสไตล์เดิมของคุณที่นี่ เพื่อให้หน้าตาเหมือนกับหน้าหลัก -->
<style>
    body { font-family: 'Poppins', sans-serif; background: #050816; color: #fff; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    .back-btn { display: inline-block; padding: 10px 20px; background: rgba(255,255,255,0.1); color: white; text-decoration: none; border-radius: 10px; margin-bottom: 20px; }
    /* นำสไตล์จากหน้า index เดิมในส่วนของ Horoscope มาใช้ที่นี่ */
    .articles-container { background: rgba(255, 255, 255, 0.03); border-radius: 20px; padding: 30px; }
    .sub-tabs { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
    .tab-btn { padding: 10px 20px; border-radius: 20px; background: rgba(255,255,255,0.1); color: #fff; cursor: pointer; border: none; }
    .tab-btn.active { background: #ff2d55; }
    .sanook-card { background: #0a0d1d; border-radius: 24px; padding: 30px; margin-top: 20px; border-left: 6px solid #ff4d4d; }
    .horo-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
    .horo-row { display: flex; gap: 20px; margin-bottom: 20px; }
    .horo-icon-box { font-size: 24px; }
    .lucky-box { display: flex; gap: 15px; margin-top: 20px; }
    .lucky-item { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; flex: 1; }
</style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-btn">⬅ กลับหน้าแรก</a>
    
    <div class="articles-container">
        <div style="text-align: center; margin-bottom: 25px;">
            <h2 style="color: #fff; font-size: 28px;">🔮 เช็กดวงรายวัน ฉบับคนเหงา</h2>
            <p style="color: #bbb;">ตรวจชะตาหัวใจ สไตล์ StyleMusicPro</p>
        </div>

        <div class="sub-tabs type-tabs">
            <button class="tab-btn active" onclick="switchHoroType('daily', this)">📅 รายวัน</button>
            <button class="tab-btn" onclick="switchHoroType('weekly', this)">📆 รายสัปดาห์</button>
            <button class="tab-btn" onclick="switchHoroType('monthly', this)">🗓️ รายเดือน</button>
        </div>

        <!-- ส่วนของดวง (ใช้โค้ดดวงที่คุณมีอยู่แล้วใส่ไว้ในแต่ละส่วนได้เลย) -->
        <div id="type-daily" class="horo-type-section">
            <!-- ตัวอย่าง: ใส่เนื้อหาดวงวันอาทิตย์ที่ผมแก้ให้คุณไว้ในข้อความก่อนหน้านี้ได้เลย -->
            <div class="sanook-card card-sun">
                <div class="horo-header"><h3>ดวงประจำวัน (อาทิตย์) ❤️</h3></div>
                <div class="horo-row">
                    <div class="horo-icon-box">💼</div>
                    <div><h4>การงาน</h4><p>งานหนักจนแทบไม่มีเวลาเศร้า ถือเป็นเรื่องดีที่คุณจะได้ไม่ฟุ้งซ่าน</p></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function switchHoroType(type, btn) {
        document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
        btn.classList.add('active');
        // เพิ่มโค้ดการสลับหน้าเนื้อหาดวงตรงนี้เหมือนใน index
    }
</script>

</body>
</html>
