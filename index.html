<!DOCTYPE html>

<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SadTune AI</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:'Poppins',sans-serif;
background:#121212;
color:white;
overflow-x:hidden;
}

/* SIDEBAR */

.sidebar{
width:220px;
height:100vh;
background:#000;
position:fixed;
left:0;
top:0;
padding:20px;
box-sizing:border-box;
}

.logo{
font-size:30px;
font-weight:bold;
color:#ff2d55;
margin-bottom:40px;
}

.menu{
margin:15px 0;
font-size:18px;
cursor:pointer;
padding:12px;
border-radius:12px;
transition:.3s;
}

.menu:hover{
background:#1f1f1f;
transform:translateX(5px);
color:#ff2d55;
}

/* MAIN */

.main{
margin-left:260px;
padding:30px;
padding-bottom:120px;
}

/* HERO */

.hero{
height:320px;
border-radius:30px;
overflow:hidden;
position:relative;
margin-bottom:40px;
background:
linear-gradient(
rgba(0,0,0,.5),
rgba(0,0,0,.8)
),
url('https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?q=80&w=1200&auto=format&fit=crop');

background-size:cover;
background-position:center;
display:flex;
align-items:center;
padding:50px;
box-sizing:border-box;
}

.hero-content{
max-width:500px;
}

.hero h1{
font-size:54px;
line-height:1.1;
margin:0;
}

.hero p{
margin-top:20px;
font-size:18px;
color:#ddd;
line-height:1.6;
}

.hero button{
margin-top:25px;
background:#ff2d55;
border:none;
padding:16px 35px;
border-radius:50px;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

.hero button:hover{
transform:scale(1.05);
box-shadow:0 0 30px rgba(255,45,85,.5);
}

/* TITLE */

.title{
font-size:38px;
font-weight:bold;
margin-bottom:20px;
}

/* SEARCH */

.search-box{
margin-bottom:30px;
}

.search-box input{
width:300px;
padding:14px;
border:none;
border-radius:30px;
background:#1f1f1f;
color:white;
font-size:16px;
border:1px solid #333;
transition:.3s;
}

.search-box input:focus{
outline:none;
border:1px solid #ff2d55;
box-shadow:0 0 15px rgba(255,45,85,.4);
}

/* SONGS */

.songs{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
gap:20px;
}

.card{
background:#181818;
padding:15px;
border-radius:20px;
transition:.4s ease;
overflow:hidden;
}

.card:hover{
transform:translateY(-8px);
background:#202020;
box-shadow:0 0 35px rgba(255,45,85,.25);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
border-radius:12px;
cursor:pointer;
transition:.4s;
}

.card:hover img{
transform:scale(1.05);
}

.song-title{
font-size:20px;
margin-top:12px;
font-weight:bold;
}

.artist{
color:#aaa;
margin-top:5px;
}

audio{
width:100%;
margin-top:10px;
}

/* PLAYER */

.bottom-player{
position:fixed;
bottom:0;
left:0;
width:100%;
height:90px;
background:rgba(24,24,24,.92);
backdrop-filter:blur(15px);
border-top:1px solid #333;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
box-sizing:border-box;
z-index:999;
}

.player-left{
display:flex;
align-items:center;
gap:15px;
}

.player-left img{
width:60px;
height:60px;
border-radius:10px;
object-fit:cover;
}

#playerTitle{
font-weight:bold;
}

.player-artist{
color:#aaa;
font-size:14px;
}

.player-center{
display:flex;
align-items:center;
gap:20px;
}

.player-center button{
background:#ff2d55;
border:none;
width:50px;
height:50px;
border-radius:50%;
color:white;
font-size:18px;
cursor:pointer;
}

/* FULLSCREEN PLAYER */

.fullscreen-player{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000;
z-index:9999;
display:none;
justify-content:center;
align-items:center;
overflow:hidden;
}

.fullscreen-bg{
position:absolute;
width:100%;
height:100%;
background:
linear-gradient(
rgba(0,0,0,.7),
rgba(0,0,0,.9)
),
url('https://picsum.photos/1200');

background-size:cover;
background-position:center;
filter:blur(20px);
transform:scale(1.2);
}

.fullscreen-content{
position:relative;
z-index:2;
text-align:center;
max-width:500px;
width:90%;
}

#fullscreenCover{
width:320px;
height:320px;
border-radius:25px;
object-fit:cover;
box-shadow:0 0 40px rgba(255,45,85,.4);
}

#fullscreenTitle{
margin-top:25px;
font-size:38px;
}

#progressBar{
width:100%;
margin-top:30px;
accent-color:#ff2d55;
}

.fullscreen-controls{
display:flex;
justify-content:center;
gap:25px;
margin-top:35px;
}

.fullscreen-controls button{
width:70px;
height:70px;
border:none;
border-radius:50%;
background:#ff2d55;
color:white;
font-size:26px;
cursor:pointer;
}

.close-player{
position:absolute;
top:20px;
right:20px;
background:none;
border:none;
color:white;
font-size:30px;
cursor:pointer;
}

/* MOBILE */

@media(max-width:768px){

.sidebar{
width:100%;
height:auto;
position:relative;
display:flex;
justify-content:space-around;
}

.main{
margin-left:0;
padding:15px;
}

.hero{
height:260px;
padding:25px;
}

.hero h1{
font-size:34px;
}

.search-box input{
width:100%;
}

.bottom-player{
flex-direction:column;
height:auto;
padding:10px;
gap:10px;
}

#fullscreenCover{
width:260px;
height:260px;
}

}

</style>

</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

<div class="logo">
🎵 SadTune AI
</div>

<div class="menu">🏠 Home</div>
<div class="menu">🔥 Trending</div>
<div class="menu">❤️ Favorites</div>
<div class="menu">🎤 AI Music</div>
<div class="menu">⚙️ Settings</div>

</div>

<!-- MAIN -->

<div class="main">

<!-- HERO -->

<div class="hero">

<div class="hero-content">

<h1>
Feel Every Broken Moment
</h1>

<p>
AI music for lonely nights, heartbreaks, and memories.
</p>

<button>
▶ Start Listening
</button>

</div>

</div>

<div class="title">
Recommended Songs
</div>

<div class="search-box">
<input type="text" id="search" placeholder="Search music...">
</div>

<div class="songs">

<!-- SONG -->

<div class="card">

<img src="https://picsum.photos/300?1">

<div class="song-title">
Died in vain
</div>

<div class="artist">
SadTune AI
</div>

<audio controls>
<source src="music/song1.mp3" type="audio/mpeg">
</audio>

</div>

<div class="card">

<img src="https://picsum.photos/300?2">

<div class="song-title">
False promises
</div>

<div class="artist">
SadTune AI
</div>

<audio controls>
<source src="music/song2.mp3" type="audio/mpeg">
</audio>

</div>

</div>

</div>

<!-- PLAYER -->

<div class="bottom-player">

<div class="player-left">

<img id="playerCover"
src="https://picsum.photos/100">

<div>

<div id="playerTitle">
No song playing
</div>

<div class="player-artist">
SadTune AI
</div>

</div>

</div>

<div class="player-center">

<button onclick="prevSong()">⏮</button>

<button onclick="togglePlay()" id="playBtn">
▶
</button>

<button onclick="nextSong()">⏭</button>

</div>

</div>

<!-- FULLSCREEN PLAYER -->

<div class="fullscreen-player" id="fullscreenPlayer">

<div class="fullscreen-bg"></div>

<div class="fullscreen-content">

<img id="fullscreenCover"
src="https://picsum.photos/500">

<h1 id="fullscreenTitle">
No song playing
</h1>

<p>SadTune AI</p>

<input type="range" id="progressBar" value="0">

<div class="fullscreen-controls">

<button onclick="prevSong()">⏮</button>

<button onclick="togglePlay()">▶</button>

<button onclick="nextSong()">⏭</button>

</div>

<button class="close-player"
onclick="closeFullscreen()">
✕ </button>

</div>

</div>

<script>

/* SEARCH */

const search =
document.getElementById("search");

search.addEventListener("keyup",function(){

let filter =
search.value.toLowerCase();

let cards =
document.querySelectorAll(".card");

cards.forEach(card=>{

let title =
card.querySelector(".song-title")
.innerText.toLowerCase();

if(title.includes(filter)){
card.style.display="block";
}else{
card.style.display="none";
}

});

});

/* PLAYER */

const audios =
document.querySelectorAll("audio");

const playerTitle =
document.getElementById("playerTitle");

const playBtn =
document.getElementById("playBtn");

const playerCover =
document.getElementById("playerCover");

let currentAudio = null;
let currentIndex = 0;

/* PLAY */

audios.forEach((audio,index)=>{

audio.addEventListener("play",()=>{

if(currentAudio &&
currentAudio !== audio){
currentAudio.pause();
}

currentAudio = audio;
currentIndex = index;

let title =
audio.parentElement
.querySelector(".song-title")
.innerText;

let cover =
audio.parentElement
.querySelector("img").src;

playerTitle.innerText = title;

playerCover.src = cover;

playBtn.innerText = "⏸";

fullscreenTitle.innerText = title;
fullscreenCover.src = cover;

});

/* AUTO NEXT */

audio.addEventListener("ended",()=>{

nextSong();

});

});

/* PLAY PAUSE */

function togglePlay(){

if(currentAudio){

if(currentAudio.paused){
currentAudio.play();
playBtn.innerText="⏸";
}else{
currentAudio.pause();
playBtn.innerText="▶";
}

}

}

/* NEXT */

function nextSong(){

currentAudio.pause();

currentIndex++;

if(currentIndex >= audios.length){
currentIndex = 0;
}

currentAudio =
audios[currentIndex];

currentAudio.play();

}

/* PREV */

function prevSong(){

currentAudio.pause();

currentIndex--;

if(currentIndex < 0){
currentIndex =
audios.length - 1;
}

currentAudio =
audios[currentIndex];

currentAudio.play();

}

/* FULLSCREEN */

const fullscreenPlayer =
document.getElementById("fullscreenPlayer");

const fullscreenTitle =
document.getElementById("fullscreenTitle");

const fullscreenCover =
document.getElementById("fullscreenCover");

document.querySelectorAll(".card img")
.forEach((img,index)=>{

img.addEventListener("click",()=>{

fullscreenPlayer.style.display="flex";

let title =
document.querySelectorAll(".song-title")[index]
.innerText;

fullscreenTitle.innerText = title;

fullscreenCover.src = img.src;

});

});

function closeFullscreen(){

fullscreenPlayer.style.display="none";

}

/* PROGRESS */

const progressBar =
document.getElementById("progressBar");

setInterval(()=>{

if(currentAudio){

progressBar.max =
currentAudio.duration;

progressBar.value =
currentAudio.currentTime;

}

},500);

progressBar.addEventListener("input",()=>{

currentAudio.currentTime =
progressBar.value;

});

</script>

</body>
</html>
