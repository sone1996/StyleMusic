<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SadTune AI Login</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;700&display=swap" rel="stylesheet">
<style>
body{
font-family:'Noto Sans Thai',sans-serif;
background:#0b0c10;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}
.box{
width:380px;
background:#171923;
padding:40px;
border-radius:20px;
}
input{
width:100%;
padding:14px;
margin-bottom:15px;
border:none;
border-radius:12px;
background:#232734;
color:white;
}
button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#ff2d55;
color:white;
font-weight:bold;
cursor:pointer;
margin-bottom:10px;
}
#userBox{
display:none;
margin-top:20px;
background:#232734;
padding:15px;
border-radius:12px;
}
</style>
</head>
<body>

<div class="box">
<h1>🎵 SadTune AI Login</h1>

<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">

<button onclick="register()">สมัครสมาชิก</button>
<button onclick="login()">เข้าสู่ระบบ</button>
<button onclick="googleLogin()">Login with Google</button>
<button onclick="logout()">Logout</button>

<div id="userBox"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
GoogleAuthProvider,
signInWithPopup,
signOut,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBLzQ5gL2Fd0PLGHqfRiBfkgiQzl8MJwXY",
  authDomain: "sadtuneai-bfb93.firebaseapp.com",
  projectId: "sadtuneai-bfb93",
  storageBucket: "sadtuneai-bfb93.firebasestorage.app",
  messagingSenderId: "602718605517",
  appId: "1:602718605517:web:49ef207af51e4a1b22d984",
  measurementId: "G-24Q1TN3F5E"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.register = async function(){
const email = document.getElementById("email").value;
const password = document.getElementById("password").value;

try{
await createUserWithEmailAndPassword(auth,email,password);
alert("สมัครสมาชิกสำเร็จ");
}catch(error){
alert(error.message);
}
}

window.login = async function(){
const email = document.getElementById("email").value;
const password = document.getElementById("password").value;

try{
await signInWithEmailAndPassword(auth,email,password);
alert("Login สำเร็จ");
}catch(error){
alert(error.message);
}
}

window.googleLogin = async function(){
const provider = new GoogleAuthProvider();

try{
await signInWithPopup(auth,provider);
}catch(error){
alert(error.message);
}
}

window.logout = async function(){
await signOut(auth);
}

onAuthStateChanged(auth,(user)=>{
const userBox = document.getElementById("userBox");

if(user){
userBox.style.display = "block";
userBox.innerHTML = `
<h3>Welcome 🎉</h3>
<p>${user.email}</p>
`;
}else{
userBox.style.display = "none";
}
});
</script>

</body>
</html>
