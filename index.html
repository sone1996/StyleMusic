<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SadTune AI</title>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#121212;
      color:white;
    }

    .sidebar{
      width:220px;
      height:100vh;
      background:#000;
      position:fixed;
      left:0;
      top:0;
      padding:20px;
    }

    .logo{
      font-size:28px;
      font-weight:bold;
      margin-bottom:40px;
      color:#ff2d55;
    }

    .menu{
      margin:20px 0;
      font-size:18px;
      cursor:pointer;
    }

    .main{
      margin-left:260px;
      padding:30px;
    }

    .title{
      font-size:32px;
      font-weight:bold;
      margin-bottom:20px;
    }

    .songs{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
      gap:20px;
    }

    .card{
      background:#181818;
      padding:15px;
      border-radius:15px;
      transition:0.3s;
    }

    .card:hover{
      background:#282828;
      transform:scale(1.03);
    }

    .card img{
      width:100%;
      border-radius:12px;
    }

    .song-title{
      font-size:18px;
      margin-top:10px;
      font-weight:bold;
    }

    .artist{
      color:#aaa;
      margin-top:5px;
    }

    audio{
      width:100%;
      margin-top:10px;
    }
  </style>
</head>

<body>

  <div class="sidebar">
    <div class="logo">🎵 SadTune AI</div>

    <div class="menu">🏠 Home</div>
    <div class="menu">🔥 Trending</div>
    <div class="menu">❤️ Favorites</div>
    <div class="menu">🎤 AI Music</div>
    <div class="menu">⚙️ Settings</div>
  </div>

  <div class="main">

    <div class="title">
      Recommended Songs
    </div>

    <div class="songs">

      <div class="card">
        <img src="https://picsum.photos/300?1">

        <div class="song-title">
          Lonely Night
        </div>

        <div class="artist">
          SadTune AI
        </div>

        <audio controls>
          <source src="">
        </audio>
      </div>

      <div class="card">
        <img src="https://picsum.photos/300?2">

        <div class="song-title">
          Broken Heart
        </div>

        <div class="artist">
          SadTune AI
        </div>

        <audio controls>
          <source src="">
        </audio>
      </div>

      <div class="card">
        <img src="https://picsum.photos/300?3">

        <div class="song-title">
          Rain Memory
        </div>

        <div class="artist">
          SadTune AI
        </div>

        <audio controls>
          <source src="">
        </audio>
      </div>

    </div>

  </div>

</body>
</html>
